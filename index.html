<body><main>
<header><small>家族と過ごす毎日を、少し穏やかに</small><h1>今日のふりかえり</h1><p class="muted">できない日があっても大丈夫。点数ではなく、小さな気づきを残すための記録です。</p></header>

<label class="item"><input type="checkbox" class="check"><span>勉強以外の楽しい話や、何気ない会話をした</span></label>
<label class="item"><input type="checkbox" class="check"><span>イライラしても、子供に感情をぶつけずに対応した</span></label>
<div class="pick"><strong>今日の自分の気持ち</strong><div class="opts mood" id="mood"></div></div>
<div class="pick"><strong>あてはまる気持ち</strong> <small>（いくつでも・なくても大丈夫）</small><div class="opts" id="feelings"></div></div>
<div class="pick"><strong>今日の天気</strong><div class="opts" id="weather"></div></div>
<label for="memo"><strong>今日のひとこと</strong> <small>（空欄でも大丈夫）</small></label><textarea id="memo" placeholder="一緒に笑ったこと、明日はこうしたいことなど"></textarea>

</section>
<section class="card"><div class="row"><h2>これまでの記録</h2><span id="total" class="count"></span></div><div class="tabs" role="tablist"><button type="button" role="tab" data-view="day" aria-selected="true">日別</button><button type="button" role="tab" data-view="week" aria-selected="false">週間</button><button type="button" role="tab" data-view="month" aria-selected="false">月間</button></div><div class="nav"><button type="button" id="prev" aria-label="前へ">‹</button><strong id="period"></strong><button type="button" id="next" aria-label="次へ">›</button></div><div id="view" role="tabpanel"></div><div class="actions"><button type="button" id="export">記録をCSVで保存</button><button type="button" id="delete">選択中の日付の記録を削除</button></div></section>
<p class="quiet">今日うまくいかなかったとしても、明日また穏やかに話せればそれで十分です。</p>
<footer>記録はこのブラウザの端末内だけに保存され、外部へ送信されません。ブラウザのデータを削除すると記録も消えるため、必要に応じてCSVで保存してください。</footer>
</main><script>
(()=>{'use strict';const KEY='oyako-reflection-v1',date=document.getElementById('date'),checks=[...document.querySelectorAll('.check')],memo=document.getElementById('memo'),status=document.getElementById('status');let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){status.textContent='保存済み記録の読み込みに失敗しました。'}

const ITEMS=['勉強の話を控えた','楽しい会話をした','感情をぶつけなかった'],WD=['月','火','水','木','金','土','日'],MOODS=[[5,'😄','とても良い'],[4,'🙂','良い'],[3,'😐','ふつう'],[2,'😕','少しつらい'],[1,'😣','つらい']],FEELINGS=['穏やか','うれしい','疲れた','イライラ','不安'],WEATHERS=[['sunny','☀️','晴れ'],['cloudy','☁️','くもり'],['rainy','🌧️','雨'],['snowy','⛄','雪']],pick={mood:null,feelings:new Set(),weather:null},view=document.getElementById('view');let mode='day',anchor=new Date();

function avg(a){return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}

function bars(s){const box=h('div','bars');ITEMS.forEach((name,i)=>{const row=h('div'),bar=h('span','bar'),fill=h('i');fill.style.width=(s.days?s.counts[i]/s.days*100:0)+'%';bar.append(fill);row.append(h('span','',name),bar,h('span','',`${s.counts[i]}/${s.days}日`));box.append(row)});return box}
function summary(s,prev,unit,len){const p=h('p','summary');if(!s.days){p.textContent=`この${unit}の記録はまだありません。記録がない日があっても大丈夫です。`;return p}let t=`この${unit}は${s.days}/${len}日記録しました。チェックできた割合は${Math.round(s.rate*100)}%です。`;if(prev.rate!=null){const diff=Math.round((s.rate-prev.rate)*100);t+=diff>0?`前の${unit}より${diff}ポイント多く、穏やかに過ごせた日が増えています。`:diff<0?`前の${unit}より少なめでしたが、そんな${unit}もあります。続けて記録していること自体が大切です。`:`前の${unit}と同じペースで続けられています。`}const best=s.counts.indexOf(Math.max(...s.counts));if(s.counts[best])t+=`いちばんできていたのは「${ITEMS[best]}」でした。`;p.textContent=t;return p}
function overall(s,prev,unit){if(!s.days)return[];let t='';const ma=avg(s.mood);if(ma!=null){const m=moodOf(ma);t+=`気持ちの平均は ${m[1]} ${ma.toFixed(1)}/5（${m[2]}）でした。`;const pa=avg(prev.mood);if(pa!=null)t+=ma-pa>=0.3?`前の${unit}より気持ちが上向いています。`:ma-pa<=-0.3?`前の${unit}より少しお疲れ気味かもしれません。`:''}else t+=`この${unit}は気持ちの記録がまだありません。`;if(s.good[1]&&s.low[1]){const g=pct(...s.good),l=pct(...s.low);t+=`気持ちが良い日のチェック率は${g}%、つらい日は${l}%でした。`;if(g-l>=20)t+='自分に余裕がある日ほど、穏やかに関われているようです。つらい日は無理をせず、まず自分を休ませてあげてください。'}if(s.strain>=Math.max(2,s.days/2))t+=`「疲れた」「イライラ」の日が${s.strain}日ありました。がんばりすぎていないか、少し手を抜ける場面を探してみましょう。`;const ws=Object.entries(s.weather).filter(([,w])=>w.days>=2).map(([k,w])=>[k,pct(w.n,w.days)]).sort((a,b)=>b[1]-a[1]);if(ws.length>=2&&ws[0][1]-ws.at(-1)[1]>=20){const[bk,br]=ws[0],[wk,wr]=ws.at(-1);t+=`${weatherOf(wk)[2]}の日はチェック率が低め（${wr}%）、${weatherOf(bk)[2]}の日は高め（${br}%）でした。`;if(wk==='rainy'||wk==='snowy')t+='外に出にくい日は、家で一緒に楽しめることを用意しておくと良いかもしれません。'}const out=[h('strong','','気持ちと天気をあわせて'),h('p','summary',t)],fs=FEELINGS.filter(f=>s.feel[f]);if(fs.length){const chips=h('div','chips');fs.forEach(f=>chips.append(h('span','chip feel',`${f} ${s.feel[f]}日`)));out.push(chips)}const wk=WEATHERS.filter(([k])=>s.weather[k]);if(wk.length){const table=h('table','grid'),head=h('tr');['天気','日数','チェック率','気持ち'].forEach(x=>head.append(h('th','',x)));table.append(head);wk.forEach(([k,e,l])=>{const w=s.weather[k],wa=avg(w.mood),tr=h('tr');tr.append(h('td','',`${e} ${l}`),h('td','',`${w.days}日`),h('td','',`${pct(w.n,w.days)}%`),h('td','',wa==null?'–':`${moodOf(wa)[1]} ${wa.toFixed(1)}`));table.append(tr)});out.push(table)}return out}
function memos(days){const list=days.filter(d=>records[fmt(d)]?.memo);if(!list.length)return[];const ul=h('ul','memos');list.forEach(d=>{const li=h('li');li.append(h('b','',md(d)),records[fmt(d)].memo);ul.append(li)});return[h('strong','','ひとこと'),ul]}
function renderDay(){const y=anchor.getFullYear(),m=anchor.getMonth(),prefix=fmt(new Date(y,m,1)).slice(0,8),keys=Object.keys(records).filter(k=>k.startsWith(prefix)).sort().reverse();document.getElementById('period').textContent=`${y}年${m+1}月`;const ul=h('ul','history');if(!keys.length)ul.append(h('li','empty','この月の記録はまだありません。'));keys.forEach(k=>{const r=records[k],li=h('li'),b=h('button'),chips=h('div','chips');b.type='button';b.append(h('strong','',`${md(parse(k))}　${r.checks.filter(Boolean).length}/3 項目　${r.mood?moodOf(r.mood)[1]:''}${r.weather?weatherOf(r.weather)[1]:''}`));ITEMS.forEach((name,i)=>chips.append(h('span',r.checks[i]?'chip on':'chip',(r.checks[i]?'✓ ':'')+name)));(r.feelings||[]).forEach(f=>chips.append(h('span','chip feel',f)));b.append(chips);if(r.memo)b.append(h('span','note',r.memo));b.addEventListener('click',()=>openDay(k));li.append(b);ul.append(li)});view.replaceChildren(ul)}
function renderWeek(){const start=weekStart(anchor),days=range(start,7),s=stats(days),prev=stats(range(addDays(start,-7),7));document.getElementById('period').textContent=`${md(start)} 〜 ${md(days[6])}`;const table=h('table','grid'),head=h('tr');head.append(h('th'));days.forEach(d=>head.append(h('th','',`${WD[(d.getDay()+6)%7]}
${d.getDate()}`)));head.style.whiteSpace='pre-line';table.append(head);ITEMS.forEach((name,i)=>{const tr=h('tr');tr.append(h('td','',name));days.forEach(d=>{const r=records[fmt(d)];tr.append(r?h('td',r.checks[i]?'on':'',r.checks[i]?'●':'・'):h('td','none','–'))});table.append(tr)});[['気持ち',r=>r.mood?moodOf(r.mood)[1]:'–'],['天気',r=>r.weather?weatherOf(r.weather)[1]:'–']].forEach(([name,f])=>{const tr=h('tr');tr.append(h('td','',name));days.forEach(d=>{const r=records[fmt(d)];tr.append(h('td',r?'':'none',r?f(r):'–'))});table.append(tr)});view.replaceChildren(table,h('small','','● できた　・ できなかった　– 記録なし'),summary(s,prev,'週',7),bars(s),...overall(s,prev,'週'),...memos(days))}
function renderMonth(){const y=anchor.getFullYear(),m=anchor.getMonth(),len=new Date(y,m+1,0).getDate(),days=range(new Date(y,m,1),len),s=stats(days),prev=stats(range(new Date(y,m-1,1),new Date(y,m,0).getDate())),today=localToday();document.getElementById('period').textContent=`${y}年${m+1}月`;const cal=h('div','cal');WD.forEach(w=>cal.append(h('span','wd',w)));for(let i=(days[0].getDay()+6)%7;i>0;i--)cal.append(h('span'));days.forEach(d=>{const k=fmt(d),r=records[k],b=h('button',(r?'l'+r.checks.filter(Boolean).length:'')+(k===today?' today':''),d.getDate());if(r?.mood)b.append(h('small','',moodOf(r.mood)[1]));b.type='button';b.title=r?`${md(d)} ${r.checks.filter(Boolean).length}/3 項目`:`${md(d)} 記録なし`;b.addEventListener('click',()=>openDay(k));cal.append(b)});const legend=h('div','legend');['記録なし','0','1','2','3 項目'].forEach((t,i)=>{const sp=h('span'),sw=h('i',i?'l'+(i-1):'');sp.append(sw,t);legend.append(sp)});view.replaceChildren(cal,legend,summary(s,prev,'月',len),bars(s),...overall(s,prev,'月'),...memos(days))}

document.getElementById('export').addEventListener('click',()=>{const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';const lines=[['日付','勉強を言いすぎなかった','楽しい会話','感情をぶつけなかった','気持ち','あてはまる気持ち','天気','メモ'],...Object.keys(records).sort().map(k=>{const r=records[k];return[k,...r.checks.map(v=>v?'はい':'いいえ'),r.mood?`${r.mood} ${moodOf(r.mood)[2]}`:'',(r.feelings||[]).join('・'),r.weather?weatherOf(r.weather)[2]:'',r.memo]})];const csv='\ufeff'+lines.map(r=>r.map(q).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='親子のふりかえり.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});buildOpts();load();render()})();
