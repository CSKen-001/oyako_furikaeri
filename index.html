<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#326a57"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="./icon-192.png">
<title>親子の穏やかな時間｜今日のふりかえり</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color-scheme:light;--bg:#f6f7f4;--ink:#27352f;--muted:#647268;--accent:#326a57;--line:#dbe4dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{max-width:700px;margin:auto;padding:25px 16px 55px}h1{font-size:1.65rem;margin:8px 0}h2{font-size:1.15rem;margin:0 0 15px}p{line-height:1.65}small,.muted{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:21px;margin:18px 0;box-shadow:0 3px 16px #243f2910}.datebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.datebar input{font:inherit;padding:9px;border-radius:9px;border:1px solid var(--line)}.item{display:flex;gap:13px;align-items:flex-start;padding:15px 0;border-top:1px solid var(--line);cursor:pointer;line-height:1.6}.item:first-of-type{border-top:none}.item input{width:24px;height:24px;accent-color:var(--accent);flex-shrink:0}textarea{width:100%;min-height:96px;padding:12px;font:inherit;border-radius:10px;border:1px solid #bccdc1;resize:vertical}button{font:inherit;border-radius:10px;border:1px solid #cbd8cc;background:white;color:var(--ink);padding:11px 15px;cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:650}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #95c7af;outline-offset:2px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.success{color:var(--accent);font-weight:600;min-height:1.5em}.history{list-style:none;padding:0;margin:0}.history li{padding:12px 0;border-top:1px solid var(--line)}.history button{text-align:left;width:100%;border:0;padding:5px;background:transparent}.history strong{display:block}.history .note{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted);font-size:.92rem}.empty{color:var(--muted)}.quiet{background:#eef4ee;border-radius:12px;padding:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.count{font-size:.94rem;color:var(--muted)}footer{font-size:.85rem;color:var(--muted)}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:9px}.tabs button[aria-selected=true]{background:var(--accent);color:white;border-color:var(--accent)}.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.nav button{padding:7px 13px}.nav strong{text-align:center}.chips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 4px}.chip{font-size:.82rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}.chip.on{background:#e3efe7;border-color:#b5d2bf;color:var(--accent);font-weight:600}.grid{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:14px}.grid th,.grid td{padding:7px 2px;text-align:center;border-top:1px solid var(--line)}.grid th:first-child,.grid td:first-child{text-align:left;padding-right:6px}.grid td.none{color:#c3cbc4}.grid .on{color:var(--accent);font-size:1.1rem}.bars{margin:6px 0 12px}.bars div{display:grid;grid-template-columns:minmax(0,1fr) 34% 4.5em;gap:8px;align-items:center;padding:5px 0;font-size:.9rem}.bar{height:9px;border-radius:9px;background:#e7ece7;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}.bars span:last-child{text-align:right;color:var(--muted)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}.cal .wd{text-align:center;font-size:.78rem;color:var(--muted)}.cal button{aspect-ratio:1;padding:0;font-size:.85rem;border-radius:8px;border:1px solid var(--line);background:white}.legend i{background:white}.cal .l0,.legend .l0{background:#f1f3ef}.cal .l1,.legend .l1{background:#d5e7db;border-color:#d5e7db}.cal .l2,.legend .l2{background:#97c3ab;border-color:#97c3ab}.cal .l3,.legend .l3{background:var(--accent);border-color:var(--accent);color:white}.cal .today{outline:2px solid #e0a64a;outline-offset:1px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:12px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:3px;border:1px solid var(--line)}.summary{background:#eef4ee;border-radius:12px;padding:11px 13px;margin:10px 0;line-height:1.6}.memos{list-style:none;padding:0;margin:0;font-size:.9rem}.memos li{padding:7px 0;border-top:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}.memos b{color:var(--muted);font-weight:600;margin-right:8px}@media(max-width:500px){h1{font-size:1.45rem}.card{padding:16px}}
</style></head>
<body><main>
<header><small>家族と過ごす毎日を、少し穏やかに</small><h1>今日のふりかえり</h1><p class="muted">できない日があっても大丈夫。点数ではなく、小さな気づきを残すための記録です。</p></header>
<section class="card" aria-labelledby="today"><div class="datebar"><h2 id="today">今日のチェック</h2><label>日付 <input type="date" id="date"></label></div>
<label class="item"><input type="checkbox" class="check"><span>子供が嫌がる勉強の話を、できるだけしなかった</span></label>
<label class="item"><input type="checkbox" class="check"><span>勉強以外の楽しい話や、何気ない会話をした</span></label>
<label class="item"><input type="checkbox" class="check"><span>イライラしても、子供に感情をぶつけずに対応した</span></label>
<label for="memo"><strong>今日のひとこと</strong> <small>（空欄でも大丈夫）</small></label><textarea id="memo" placeholder="一緒に笑ったこと、明日はこうしたいことなど"></textarea>
<div class="actions"><button type="button" class="primary" id="save">この日の記録を保存</button><button type="button" id="clear">入力を元に戻す</button></div><p class="success" id="status" role="status" aria-live="polite"></p>
</section>
<section class="card"><div class="row"><h2>これまでの記録</h2><span id="total" class="count"></span></div><div class="tabs" role="tablist"><button type="button" role="tab" data-view="day" aria-selected="true">日別</button><button type="button" role="tab" data-view="week" aria-selected="false">週間</button><button type="button" role="tab" data-view="month" aria-selected="false">月間</button></div><div class="nav"><button type="button" id="prev" aria-label="前へ">‹</button><strong id="period"></strong><button type="button" id="next" aria-label="次へ">›</button></div><div id="view" role="tabpanel"></div><div class="actions"><button type="button" id="export">記録をCSVで保存</button><button type="button" id="delete">選択中の日付の記録を削除</button></div></section>
<p class="quiet">今日うまくいかなかったとしても、明日また穏やかに話せればそれで十分です。</p>
<footer>記録はこのブラウザの端末内だけに保存され、外部へ送信されません。ブラウザのデータを削除すると記録も消えるため、必要に応じてCSVで保存してください。</footer>
</main><script>
(()=>{'use strict';const KEY='oyako-reflection-v1',date=document.getElementById('date'),checks=[...document.querySelectorAll('.check')],memo=document.getElementById('memo'),status=document.getElementById('status');let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){status.textContent='保存済み記録の読み込みに失敗しました。'}
function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function load(){const r=records[date.value];checks.forEach((c,i)=>c.checked=!!(r&&r.checks[i]));memo.value=r?.memo||'';status.textContent=''}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){status.textContent='保存できませんでした。ブラウザの保存設定や空き容量をご確認ください。';return false}}
const ITEMS=['勉強の話を控えた','楽しい会話をした','感情をぶつけなかった'],WD=['月','火','水','木','金','土','日'],view=document.getElementById('view');let mode='day',anchor=new Date();
function fmt(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parse(k){const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function weekStart(d){return addDays(d,-((d.getDay()+6)%7))}
function md(d){return `${d.getMonth()+1}/${d.getDate()}（${WD[(d.getDay()+6)%7]}）`}
function h(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function range(from,n){return Array.from({length:n},(_,i)=>addDays(from,i))}
function stats(days){const s={days:0,counts:[0,0,0],rate:null};let t=0;days.forEach(d=>{const r=records[fmt(d)];if(r){s.days++;r.checks.forEach((v,i)=>{if(v){s.counts[i]++;t++}})}});if(s.days)s.rate=t/(s.days*3);return s}
function openDay(k){date.value=k;load();window.scrollTo({top:0,behavior:'smooth'})}
function bars(s){const box=h('div','bars');ITEMS.forEach((name,i)=>{const row=h('div'),bar=h('span','bar'),fill=h('i');fill.style.width=(s.days?s.counts[i]/s.days*100:0)+'%';bar.append(fill);row.append(h('span','',name),bar,h('span','',`${s.counts[i]}/${s.days}日`));box.append(row)});return box}
function summary(s,prev,unit,len){const p=h('p','summary');if(!s.days){p.textContent=`この${unit}の記録はまだありません。記録がない日があっても大丈夫です。`;return p}let t=`この${unit}は${s.days}/${len}日記録しました。チェックできた割合は${Math.round(s.rate*100)}%です。`;if(prev.rate!=null){const diff=Math.round((s.rate-prev.rate)*100);t+=diff>0?`前の${unit}より${diff}ポイント多く、穏やかに過ごせた日が増えています。`:diff<0?`前の${unit}より少なめでしたが、そんな${unit}もあります。続けて記録していること自体が大切です。`:`前の${unit}と同じペースで続けられています。`}const best=s.counts.indexOf(Math.max(...s.counts));if(s.counts[best])t+=`いちばんできていたのは「${ITEMS[best]}」でした。`;p.textContent=t;return p}
function memos(days){const list=days.filter(d=>records[fmt(d)]?.memo);if(!list.length)return[];const ul=h('ul','memos');list.forEach(d=>{const li=h('li');li.append(h('b','',md(d)),records[fmt(d)].memo);ul.append(li)});return[h('strong','','ひとこと'),ul]}
function renderDay(){const y=anchor.getFullYear(),m=anchor.getMonth(),prefix=fmt(new Date(y,m,1)).slice(0,8),keys=Object.keys(records).filter(k=>k.startsWith(prefix)).sort().reverse();document.getElementById('period').textContent=`${y}年${m+1}月`;const ul=h('ul','history');if(!keys.length)ul.append(h('li','empty','この月の記録はまだありません。'));keys.forEach(k=>{const r=records[k],li=h('li'),b=h('button'),chips=h('div','chips');b.type='button';b.append(h('strong','',`${md(parse(k))}　${r.checks.filter(Boolean).length}/3 項目`));ITEMS.forEach((name,i)=>chips.append(h('span',r.checks[i]?'chip on':'chip',(r.checks[i]?'✓ ':'')+name)));b.append(chips);if(r.memo)b.append(h('span','note',r.memo));b.addEventListener('click',()=>openDay(k));li.append(b);ul.append(li)});view.replaceChildren(ul)}
function renderWeek(){const start=weekStart(anchor),days=range(start,7),s=stats(days),prev=stats(range(addDays(start,-7),7));document.getElementById('period').textContent=`${md(start)} 〜 ${md(days[6])}`;const table=h('table','grid'),head=h('tr');head.append(h('th'));days.forEach(d=>head.append(h('th','',`${WD[(d.getDay()+6)%7]}
${d.getDate()}`)));head.style.whiteSpace='pre-line';table.append(head);ITEMS.forEach((name,i)=>{const tr=h('tr');tr.append(h('td','',name));days.forEach(d=>{const r=records[fmt(d)];tr.append(r?h('td',r.checks[i]?'on':'',r.checks[i]?'●':'・'):h('td','none','–'))});table.append(tr)});view.replaceChildren(table,h('small','','● できた　・ できなかった　– 記録なし'),summary(s,prev,'週',7),bars(s),...memos(days))}
function renderMonth(){const y=anchor.getFullYear(),m=anchor.getMonth(),len=new Date(y,m+1,0).getDate(),days=range(new Date(y,m,1),len),s=stats(days),prev=stats(range(new Date(y,m-1,1),new Date(y,m,0).getDate())),today=localToday();document.getElementById('period').textContent=`${y}年${m+1}月`;const cal=h('div','cal');WD.forEach(w=>cal.append(h('span','wd',w)));for(let i=(days[0].getDay()+6)%7;i>0;i--)cal.append(h('span'));days.forEach(d=>{const k=fmt(d),r=records[k],b=h('button',(r?'l'+r.checks.filter(Boolean).length:'')+(k===today?' today':''),d.getDate());b.type='button';b.title=r?`${md(d)} ${r.checks.filter(Boolean).length}/3 項目`:`${md(d)} 記録なし`;b.addEventListener('click',()=>openDay(k));cal.append(b)});const legend=h('div','legend');['記録なし','0','1','2','3 項目'].forEach((t,i)=>{const sp=h('span'),sw=h('i',i?'l'+(i-1):'');sp.append(sw,t);legend.append(sp)});view.replaceChildren(cal,legend,summary(s,prev,'月',len),bars(s),...memos(days))}
function render(){document.getElementById('total').textContent=`全${Object.keys(records).length}日分`;({day:renderDay,week:renderWeek,month:renderMonth})[mode]()}
function shift(n){anchor=mode==='week'?addDays(anchor,7*n):new Date(anchor.getFullYear(),anchor.getMonth()+n,1);render()}
document.querySelectorAll('[data-view]').forEach(t=>t.addEventListener('click',()=>{mode=t.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-selected',x===t));render()}));document.getElementById('prev').addEventListener('click',()=>shift(-1));document.getElementById('next').addEventListener('click',()=>shift(1));
date.value=localToday();date.addEventListener('change',()=>{load();if(date.value){anchor=parse(date.value);render()}});document.getElementById('save').addEventListener('click',()=>{if(!date.value){status.textContent='日付を選んでください。';return}records[date.value]={checks:checks.map(c=>c.checked),memo:memo.value.trim()};if(persist()){status.textContent='保存しました。今日もお疲れさまでした。';render()}});document.getElementById('clear').addEventListener('click',load);
document.getElementById('delete').addEventListener('click',()=>{if(!records[date.value]){status.textContent='この日付には保存済みの記録がありません。';return}if(confirm(`${date.value} の記録を削除しますか？`)){delete records[date.value];if(persist()){load();status.textContent='記録を削除しました。';render()}}});
document.getElementById('export').addEventListener('click',()=>{const q=x=>'"'+String(x??'').replaceAll('"','""')+'"';const lines=[['日付','勉強を言いすぎなかった','楽しい会話','感情をぶつけなかった','メモ'],...Object.keys(records).sort().map(k=>[k,...records[k].checks.map(v=>v?'はい':'いいえ'),records[k].memo])];const csv='\ufeff'+lines.map(r=>r.map(q).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='親子のふりかえり.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});load();render()})();
</script><script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script></body></html>
